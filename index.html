<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- 外部ニュースサイトの画像ブロック（ホットリンク拒絶）を完全に回避する重要設定 -->
  <meta name="referrer" content="no-referrer">
  <title>Daily Pulse</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-radius: 22px;
      --accent-yellow: #facc15;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: #ffffff;
      font-family: var(--font-family);
      min-height: 100vh;
      padding: 24px 16px 60px;
      overflow-x: hidden;
    }

    header {
      margin-bottom: 24px;
      padding: 0 4px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .date-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      font-weight: 700;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-top: 4px;
    }

    .status-message {
      grid-column: span 2;
      text-align: center;
      padding: 40px 0;
      color: #94a3b8;
      font-size: 14px;
    }

    /* 2カラム グリッド */
    .feed-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .news-card {
      position: relative;
      height: 230px;
      border-radius: var(--card-radius);
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .news-card:active {
      transform: scale(0.96);
    }

    .card-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-color: #1e293b;
      z-index: 1;
      transition: transform 0.5s ease;
    }
    .news-card:hover .card-bg {
      transform: scale(1.05);
    }
    .card-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(11,15,25,0.2) 0%, rgba(11,15,25,0.82) 70%, rgba(11,15,25,0.98) 100%);
      z-index: 2;
    }

    .card-content {
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .genre-badge {
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .card-title {
      font-size: 14.5px;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -0.2px;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* モーダル共通バックドロップ */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      background: #151c2e;
      border-radius: 28px;
      padding: 24px 20px 28px;
      overflow-y: auto;
      transform: scale(0.9);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .modal-backdrop.active .modal-card {
      transform: scale(1);
    }

    .close-button {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #ffffff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    .modal-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      background: rgba(255, 255, 255, 0.15);
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 16px;
      padding-right: 28px;
    }

    .modal-media-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
      background-color: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: none;
    }
    .modal-media-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .section-box {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .section-box.by-the-way {
      background: rgba(250, 204, 21, 0.08);
      border: 1px solid rgba(250, 204, 21, 0.25);
    }

    .section-label {
      font-size: 11.5px;
      font-weight: 750;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .section-box.by-the-way .section-label {
      color: var(--accent-yellow);
    }

    .section-text {
      font-size: 14px;
      line-height: 1.6;
      color: #e2e8f0;
    }

    .keywords-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .primary-keyword-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 999px;
      color: var(--accent-blue);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .primary-keyword-tag:active {
      transform: scale(0.95);
      background: rgba(56, 189, 248, 0.25);
    }

    .link-button {
      display: block;
      width: 100%;
      text-align: center;
      padding: 14px;
      background: #ffffff;
      color: #0b0f19;
      font-weight: 750;
      font-size: 14px;
      border-radius: 14px;
      text-decoration: none;
      margin-top: 18px;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
    }

    /* レイヤー2：一次キーワード詳細ポップアップ */
    .kw-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .kw-modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .kw-modal-card {
      position: relative;
      width: 100%;
      max-width: 410px;
      max-height: 82vh;
      background: #1e293b;
      border-radius: 24px;
      padding: 22px 18px 24px;
      overflow-y: auto;
      transform: scale(0.92);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .kw-modal-backdrop.active .kw-modal-card {
      transform: scale(1);
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 14px;
    }

    /* ステップ1準拠の確実なヘッダー・丸アバター設計 */
    .kw-profile-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .kw-avatar-box {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2.5px solid var(--accent-blue);
      background: linear-gradient(135deg, #1e293b, #0f172a);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.25);
    }

    .kw-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .kw-avatar-svg {
      width: 32px;
      height: 32px;
      fill: #38bdf8;
      display: none;
    }

    .kw-title-group {
      min-width: 0;
    }

    .kw-title {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }

    .kw-subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 3px;
      line-height: 1.4;
    }

    /* 地図 */
    .map-frame {
      width: 100%;
      height: 180px;
      border-radius: 14px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .map-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .secondary-keyword-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      background: rgba(192, 132, 252, 0.15);
      border: 1px solid rgba(192, 132, 252, 0.35);
      border-radius: 999px;
      color: var(--accent-purple);
      font-size: 11.5px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s ease;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="date-label">TODAY'S INTELLIGENCE</div>
      <h1>Daily Pulse</h1>
    </div>
  </header>

  <main class="feed-grid" id="feedGrid">
    <div class="status-message" id="statusMessage">最新インテリジェンスを受信中...</div>
  </main>

  <!-- レイヤー1：記事詳細モーダル -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-card">
      <button class="close-button" id="closeButton">✕</button>
      <span class="modal-badge" id="modalGenre">GENRE</span>
      <h2 class="modal-title" id="modalTitle">Title</h2>

      <div class="modal-media-frame" id="modalMediaFrame">
        <img id="modalMediaImg" src="" alt="Article Photo">
      </div>

      <div class="section-box">
        <div class="section-label">📌 客観ファクト（一次事実）</div>
        <div class="section-text" id="modalFact">Fact content</div>
      </div>

      <div class="section-box by-the-way" id="modalBTWBox">
        <div class="section-label">💡 ちなみに！（文脈・熱量）</div>
        <div class="section-text" id="modalBTW">By the way content</div>
      </div>

      <div class="section-box" id="modalKeywordsBox">
        <div class="section-label">⚡ 一次キーワード（詳細・動向）</div>
        <div class="keywords-container" id="modalKeywords"></div>
      </div>

      <a href="#" target="_blank" class="link-button" id="modalLink">元記事の一次ソースを読む →</a>
    </div>
  </div>

  <!-- レイヤー2：一次キーワード詳細動向ポップアップ（ステップ1準拠の確定構造） -->
  <div class="kw-modal-backdrop" id="kwModalBackdrop">
    <div class="kw-modal-card">
      <button class="back-button" id="kwBackButton">← 記事詳細に戻る</button>
      
      <!-- ヘッダーエリア：丸アバター枠 ＋ タイトル・肩書 -->
      <div class="kw-profile-header">
        <div class="kw-avatar-box" id="kwAvatarBox">
          <img class="kw-avatar-img" id="kwAvatarImg" src="" alt="Avatar">
          <!-- 画像がnullやエラーの場合のSVGフォールバック -->
          <svg class="kw-avatar-svg" id="kwAvatarSvg" viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <div class="kw-title-group">
          <h3 class="kw-title" id="kwTitle"></h3>
          <div class="kw-subtitle" id="kwSubtitle"></div>
        </div>
      </div>

      <!-- 地図等の動的ウィジェット -->
      <div id="kwRichWidget"></div>

      <div class="section-box">
        <div class="section-label">📊 最近の動向・近況サマリー</div>
        <div class="section-text" id="kwModalSummary">Summary content</div>
      </div>

      <div class="section-box">
        <div class="section-label">🔍 二次キーワード（Google検索）</div>
        <div class="keywords-container" id="kwSecondaryContainer"></div>
      </div>
    </div>
  </div>

  <script>
    // ★★★ ご自身のGAS WebアプリURLをここに貼り付けてください ★★★
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzOdNSo1fFPwspu66gFe6jP6YmyCSRyYLc0wWL1ddEqmjDTJpaRkj49lK7m80WXeGyQTw/exec";

    const feedGrid = document.getElementById('feedGrid');
    const statusMessage = document.getElementById('statusMessage');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const closeButton = document.getElementById('closeButton');
    const kwModalBackdrop = document.getElementById('kwModalBackdrop');
    const kwBackButton = document.getElementById('kwBackButton');

    async function loadNews() {
      try {
        const res = await fetch(GAS_API_URL);
        const articles = await res.json();

        if (!articles || articles.length === 0) {
          statusMessage.innerText = "本日の記事は準備中です。";
          return;
        }

        statusMessage.remove();
        renderFeed(articles);

      } catch (err) {
        console.error(err);
        statusMessage.innerText = "データの取得に失敗しました。";
      }
    }

    function renderFeed(articles) {
      feedGrid.innerHTML = '';
      articles.forEach(item => {
        const card = document.createElement('div');
        card.className = 'news-card';
        card.innerHTML = `
          <div class="card-bg" style="background-image: url('${item.image || ''}')"></div>
          <div class="card-overlay"></div>
          <div class="card-content">
            <span class="genre-badge">${item.genre}</span>
            <div class="card-title">${item.title}</div>
          </div>
        `;
        card.onclick = () => openMainModal(item);
        feedGrid.appendChild(card);
      });
    }

    function openMainModal(item) {
      document.getElementById('modalGenre').innerText = item.genre;
      document.getElementById('modalTitle').innerText = item.title;
      
      const mediaFrame = document.getElementById('modalMediaFrame');
      const mediaImg = document.getElementById('modalMediaImg');
      if (item.image) {
        mediaImg.src = item.image;
        mediaFrame.style.display = 'block';
      } else {
        mediaFrame.style.display = 'none';
      }

      document.getElementById('modalFact').innerText = item.fact || '事実情報の取得中';
      
      const btwBox = document.getElementById('modalBTWBox');
      if (item.byTheWay) {
        document.getElementById('modalBTW').innerText = item.byTheWay;
        btwBox.style.display = 'block';
      } else {
        btwBox.style.display = 'none';
      }

      document.getElementById('modalLink').href = item.link || '#';

      const kwContainer = document.getElementById('modalKeywords');
      const kwBox = document.getElementById('modalKeywordsBox');
      kwContainer.innerHTML = '';

      if (item.primaryKeywords && item.primaryKeywords.length > 0) {
        kwBox.style.display = 'block';
        item.primaryKeywords.forEach(kw => {
          const btn = document.createElement('button');
          btn.className = 'primary-keyword-tag';
          let icon = "⚡";
          const typeLower = (kw.type || "").toLowerCase().trim();
          if (typeLower === "player" || typeLower === "person" || typeLower === "athlete" || typeLower === "選手") icon = "👤";
          if (typeLower === "standing") icon = "📊";
          if (typeLower === "location") icon = "📍";
          
          btn.innerHTML = `<span>${kw.name}</span><span>${icon}</span>`;
          btn.onclick = (e) => {
            e.stopPropagation();
            // 親記事の写真URL (item.image) を渡す
            openKeywordModal(kw, item.image || "");
          };
          kwContainer.appendChild(btn);
        });
      } else {
        kwBox.style.display = 'none';
      }

      modalBackdrop.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    // レイヤー2：一次キーワードポップアップ（確定構造 ＆ フォールバック保証）
    function openKeywordModal(kw, parentArticleImage) {
      const avatarBox = document.getElementById('kwAvatarBox');
      const avatarImg = document.getElementById('kwAvatarImg');
      const avatarSvg = document.getElementById('kwAvatarSvg');
      const kwTitle = document.getElementById('kwTitle');
      const kwSubtitle = document.getElementById('kwSubtitle');
      const widgetBox = document.getElementById('kwRichWidget');

      widgetBox.innerHTML = '';
      kwTitle.innerText = kw.name;
      kwSubtitle.innerText = kw.role || '';

      const typeStr = (kw.type || "").toLowerCase().trim();
      const isPlayer = typeStr === "player" || typeStr === "person" || typeStr === "athlete" || typeStr === "選手";

      if (isPlayer) {
        avatarBox.style.display = 'flex';

        // 写真候補: kw.photoUrl ➔ 親記事写真
        const photoCandidate = (kw.photoUrl && kw.photoUrl.startsWith('http')) 
          ? kw.photoUrl 
          : ((parentArticleImage && parentArticleImage.startsWith('http')) ? parentArticleImage : null);

        if (photoCandidate) {
          avatarImg.style.display = 'block';
          avatarSvg.style.display = 'none';
          avatarImg.src = photoCandidate;

          // 画像の読み込みに失敗（403など）した場合はSVGアイコンに即時フォールバック
          avatarImg.onerror = () => {
            avatarImg.style.display = 'none';
            avatarSvg.style.display = 'block';
          };
        } else {
          // 画像が元々nullの場合は、最初から美しいSVGシルエットアバターを表示
          avatarImg.style.display = 'none';
          avatarSvg.style.display = 'block';
        }
      } else {
        // 人物以外（大会、場所など）は丸アイコン枠を非表示
        avatarBox.style.display = 'none';
      }

      // 地図表示
      if (typeStr === "location" && kw.locationQuery) {
        const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(kw.locationQuery)}&output=embed`;
        widgetBox.innerHTML = `
          <div class="section-box" style="padding: 10px 12px; margin-bottom:12px;">
            <div class="section-label">📍 現地ロケーション（マップ）</div>
            <div class="map-frame">
              <iframe src="${mapUrl}" width="100%" height="100%" style="border:none;" loading="lazy"></iframe>
            </div>
          </div>
        `;
      }

      document.getElementById('kwModalSummary').innerText = kw.summary || '詳細情報なし';

      // 二次キーワードタグ
      const secContainer = document.getElementById('kwSecondaryContainer');
      secContainer.innerHTML = '';
      if (kw.secondaryKeywords && kw.secondaryKeywords.length > 0) {
        kw.secondaryKeywords.forEach(secWord => {
          const a = document.createElement('a');
          a.className = 'secondary-keyword-tag';
          a.href = `https://www.google.com/search?q=${encodeURIComponent(secWord)}`;
          a.target = '_blank';
          a.innerHTML = `<span>${secWord}</span><span>↗</span>`;
          secContainer.appendChild(a);
        });
      }

      kwModalBackdrop.classList.add('active');
    }

    function closeKeywordModal() {
      kwModalBackdrop.classList.remove('active');
    }

    function closeMainModal() {
      modalBackdrop.classList.remove('active');
      document.body.style.overflow = '';
    }

    closeButton.onclick = closeMainModal;
    modalBackdrop.onclick = (e) => {
      if (e.target === modalBackdrop) closeMainModal();
    };

    kwBackButton.onclick = closeKeywordModal;
    kwModalBackdrop.onclick = (e) => {
      if (e.target === kwModalBackdrop) closeKeywordModal();
    };

    loadNews();
  </script>
</body>
</html>
